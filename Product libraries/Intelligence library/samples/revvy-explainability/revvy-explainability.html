/* ======================= Component markup helpers (mirror the parent React components) ======================= */
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function Button({priority='primary',size='medium',icon,label,iconOnly=false,aria,attrs=''}){
  return `<button type="button" class="Button_root Button_${priority}" data-size="${size}"${iconOnly?' data-icon-only':''}${aria?` aria-label="${esc(aria)}"`:''} ${attrs}>${icon?`<span class="Button_icon" aria-hidden="true">${ic(icon)}</span>`:''}${!iconOnly&&label?`<span class="Button_label">${esc(label)}</span>`:''}</button>`;
}
function Badge(text,{kind='category',tone}={}){return `<span class="Badge_root" data-kind="${kind}" data-tone="${tone||'neutral'}"><span class="Badge_label">${esc(text)}</span></span>`}
function Link(text,{icon='externalLink',attrs=''}={}){return `<a class="Link_root Link_standalone" data-variant="standalone" href="#" ${attrs}>${esc(text)}<span class="Link_icon" aria-hidden="true">${ic(icon)}</span></a>`}
function Chip(text,pressed,attrs=''){return `<button type="button" class="Chip_root" data-variant="choice" aria-pressed="${pressed}"${pressed?' data-selected':''} ${attrs}>${pressed?`<span class="Chip_leading" data-type="icon" aria-hidden="true">${ic('check')}</span>`:''}<span class="Chip_label">${esc(text)}</span></button>`}
/* Card: header (title, subtitle, header action), body, footer (meta + actions). Clickable cards use the stretch button. */
function Card({title,subtitle,headerAction='',body='',footerMeta='',actions='',compact=false,onClickAttr='',tone='',expandable=false,open=true,details='',attrs=''}){
  const stretch=onClickAttr?`<button type="button" class="Card_stretch" aria-pressed="false" ${onClickAttr}>${title}</button>`:title;
  const hasHeader=title||subtitle||headerAction||expandable;
  return `<div class="Card_root" data-variant="basic"${compact?' data-compact':''}${onClickAttr?' data-interactive':''}${expandable&&open?' data-expanded':''}${tone?` data-tone="${tone}"`:''} ${attrs}><div class="Card_content">
    ${hasHeader?`<div class="Card_header"><div class="Card_headings">${title?`<h3 class="Card_title">${stretch}</h3>`:''}${subtitle?`<div class="Card_subtitle">${subtitle}</div>`:''}</div>${headerAction?`<div class="Card_above">${headerAction}</div>`:''}${expandable?`<span class="Card_above">${Button({priority:'tertiary',size:'small',iconOnly:true,icon:open?'chevronUp':'chevronDown',aria:'Details',attrs:`data-act="toggle" aria-expanded="${open}"`})}</span>`:''}</div>`:''}
    ${body?`<div class="Card_body">${body}</div>`:''}
    ${expandable?`<div class="Card_details Card_above"${open?'':' hidden'}>${details}</div>`:''}
    ${footerMeta||actions?`<div class="Card_footer Card_above">${footerMeta?`<div class="Card_footerMeta">${footerMeta}</div>`:''}${actions?`<div class="Card_actions">${actions}</div>`:''}</div>`:''}
  </div></div>`;
}

   data -> Markdown (single source of truth) -> parsed blocks -> Card UI. Cards, Markdown column and RevvyAI all use it. */
const PLACEHOLDER={
  title:'Model',badge:'Score',updated:'Last updated on Month DD, YYYY',
  thesis:"Add a brief introduction here (max 150 characters) that summarizes the topic, provides context, and prepares users for what's next.",
  factors:'Top [factors]',
  intro:"Add a brief introduction here (max 150 characters) that summarizes the topic, provides context, and prepares users for what's next.",
  items:[0,1,2].map(()=>({driver:'Driver: Top driver',label:'Label',desc:'Description'})),
  cta:'Add a concise, action-oriented CTA here (max 100 characters) that encourages users to learn more.',
  link:'Talk with RevvyAI'
};
const VARIANTS={
  'Expandable / Expand=True': {shell:'card',badge:true, collapsible:true,start:true},
  'Expandable / Expand=False':{shell:'card',badge:true, collapsible:true,start:false},
  'Card / Base':              {shell:'card',badge:true},
  'Card / Callout':           {shell:'callout',badge:false},
  'Story / Page':             {shell:'story',badge:true},
  'Story / Inline':           {shell:'story',badge:false,inline:true}
};

function toMd(d,cfg,open=true){
  const b=[];
  if(!cfg.inline)b.push(`**${d.title}**${cfg.badge&&d.badge?` \`${d.badge}\``:''}\n_${d.updated}_`);
  if(cfg.collapsible&&!open)return b.join('\n\n');
  if(!cfg.inline)b.push(d.thesis);
  b.push(`**${d.factors}**\n${d.intro}`);
  b.push(d.items.map(i=>`- ${i.driver} \`${i.label}\`\n  ${i.desc}`).join('\n'));
  if(!cfg.inline)b.push(d.cta);
  b.push(`[${d.link}](#)`);
  return b.join('\n\n');
}
function parseMd(md){
  const out=[];let seenList=false;
  md.split('\n\n').forEach((t,i)=>{
    const L=t.split('\n');
    if(L[1]&&L[1].startsWith('_')&&t.startsWith('**'))out.push({role:'header',md:t,i});
    else if(t.startsWith('- ')){seenList=true;out.push({role:'list',md:t,i})}
    else if(t.startsWith('['))out.push({role:'link',md:t,i});
    else if(t.startsWith('**')&&L[1])out.push({role:'intro',md:t,i});
    else out.push({role:seenList?'cta':'thesis',md:t,i});
  });
  return out;
}
const inl=s=>esc(s).replace(/`([^`]+)`/g,(m,x)=>Badge(x,{kind:'category',tone:'info'})).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
/* each rendered piece carries data-b so it maps one to one onto a Markdown block */
const mr=(i,cls,inner,tag='div')=>`<${tag} class="mr ${cls}" data-b="${i}">${inner}</${tag}>`;
function renderParts(blocks){
  const P={};
  blocks.forEach(b=>{
    const L=b.md.split('\n');
    if(b.role==='header'){
      const m=L[0].match(/^\*\*(.+?)\*\*\s*(?:`(.+?)`)?$/);
      P.header={i:b.i,title:esc(m[1]),badge:m[2]?Badge(m[2],{kind:'category'}):'',sub:esc(L[1].replace(/^_|_$/g,''))};
    }else if(b.role==='intro')P.intro=mr(b.i,'x-intro',`<b>${esc(L[0].replace(/\*\*/g,''))}</b><p class="x-p">${esc(L.slice(1).join(' '))}</p>`);
    else if(b.role==='list'){
      const items=b.md.split(/\n(?=- )/).map(x=>x.split('\n'));
      P.list=mr(b.i,'x-list',items.map(it=>`<li><div class="x-l1">${inl(it[0].slice(2))}</div><div class="x-l2">${esc((it[1]||'').trim())}</div></li>`).join(''),'ul');
    }else if(b.role==='link')P.link={i:b.i,html:Link(b.md.match(/\[(.+?)\]/)[1],{attrs:`data-act="link" data-b="${b.i}"`})};
    else P[b.role]=mr(b.i,'x-p',esc(b.md),'p');
  });
  return P;
}
function voteButtons(st){
  return `<span class="x-vote">Was this helpful?${Button({priority:'tertiary',size:'small',iconOnly:true,icon:'thumbUp',aria:'Helpful',attrs:`data-act="up" aria-pressed="${st.vote==='up'}"`})}${Button({priority:'tertiary',size:'small',iconOnly:true,icon:'thumbDown',aria:'Not helpful',attrs:`data-act="down" aria-pressed="${st.vote==='down'}"`})}</span>`;
}
function buildCard(md,cfg,st,id){
  const P=renderParts(parseMd(md));
  const bodyHtml=[P.thesis,P.intro&&P.list?`<div class="x-body">${P.intro}${P.list}</div>`:'',P.cta].filter(Boolean).join('');
  const meta=P.link?P.link.html:'';
  const open=cfg.collapsible?st.open:true;
  if(cfg.shell==='story'){
    return `<div class="xb xcard" data-card="${id}"><div class="story">
      ${P.header?`<div class="story-hdr mr" data-b="${P.header.i}"><div class="t"><h3 class="Card_title">${P.header.title}</h3><div class="Card_subtitle">${P.header.sub}</div></div>${P.header.badge}</div>`:''}
      <div class="x-body">${bodyHtml}</div>
      <div class="story-ft">${meta}${voteButtons(st)}</div></div></div>`;
  }
  const h=P.header;
  const title=h?`<span class="mr" data-b="${h.i}">${h.title}</span>`:'';
  const common={title,subtitle:h?h.sub:'',headerAction:h?h.badge:'',tone:cfg.shell==='callout'?'callout':''};
  if(cfg.collapsible){
    return `<div class="xb xcard" data-card="${id}">${Card({...common,expandable:true,open,details:`<div class="x-body">${bodyHtml}<div class="Card_footer" style="display:flex;justify-content:space-between;align-items:center">${meta}${voteButtons(st)}</div></div>`})}</div>`;
  }
  return `<div class="xb xcard" data-card="${id}">${Card({...common,body:`<div class="x-body">${bodyHtml}</div>`,footerMeta:meta,actions:voteButtons(st)})}</div>`;
}

/* ======================= Markdown column ======================= */
let currentMd='';
/* Minimal Markdown renderer for the output column: bold, italic, inline code, links, bullet lists, line breaks. */
function mdInline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[\s(])_(.+?)_(?=[\s).,]|$)/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)]*)\)/g,'<a href="$2">$1</a>');
}
function mdBlockHtml(t){
  if(t.startsWith('- ')){
    const items=t.split(/\n(?=- )/).map(x=>x.slice(2).split('\n').map(l=>l.trim()).map(mdInline).join('<br>'));
    return `<ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
  }
  return `<p>${t.split('\n').map(mdInline).join('<br>')}</p>`;
}
let mdMode='rendered';
function setMd(md){
  currentMd=md;
  $('#mdbody').innerHTML=md
    ?md.split('\n\n').map((t,i)=>mdMode==='source'?`<div class="mb src" data-b="${i}">${esc(t)}</div>`:`<div class="mb" data-b="${i}">${mdBlockHtml(t)}</div>`).join('')
    :'<div class="mdempty">Select a card or ask RevvyAI to see its Markdown.</div>';
  $('#mdbody').querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>e.preventDefault()));
}
function renderModes(){
  $('#mdModes').innerHTML=[['rendered','Rendered'],['source','Source']].map(([k,l])=>Chip(l,mdMode===k,`data-md-mode="${k}"`)).join('');
}
function renderPanes(){
  const cur=$('#stage').dataset.pane;
  $('#paneChips').innerHTML=[['cards','Cards'],['md','Markdown'],['revvy','RevvyAI']].map(([k,l])=>Chip(l,cur===k,`data-pane-btn="${k}"`)).join('');
}
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-md-mode]');if(m){mdMode=m.dataset.mdMode;renderModes();setMd(currentMd);return}
  const p=e.target.closest('[data-pane-btn]');if(p){$('#stage').dataset.pane=p.dataset.paneBtn;renderPanes()}
});
function liveViews(){return [$('#mdbody'),document.querySelector('.sample.sel'),[...document.querySelectorAll('#vChat .xcard')].pop()].filter(Boolean)}
document.addEventListener('mouseover',e=>{
  document.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));
  const el=e.target.closest('[data-b]');if(!el)return;
  const views=liveViews();if(!views.some(v=>v.contains(el)))return;
  views.forEach(v=>v.querySelectorAll(`[data-b="${el.dataset.b}"]`).forEach(x=>x.classList.add('hl')));
});

const cardState={};let selected=null;
const mdOf=name=>{const c=VARIANTS[name],s=cardState[name];return toMd(PLACEHOLDER,c,c.collapsible?s.open:true)};
function renderSample(name){
  const sec=document.querySelector(`.sample[data-name="${name}"]`);
  sec.querySelector('.slot').innerHTML=buildCard(mdOf(name),VARIANTS[name],cardState[name],name);
}
function select(name,feed=true){
  selected=name;
  document.querySelectorAll('.sample').forEach(s=>s.classList.toggle('sel',s.dataset.name===name));
  const md=mdOf(name);setMd(md);
  if(feed)feedRevvy(name,md);
}
(function initCards(){
  const col=$('#cardsCol');
  Object.keys(VARIANTS).forEach(name=>{
    cardState[name]={open:VARIANTS[name].start!==false,vote:null};
    const sec=document.createElement('div');sec.className='sample';sec.dataset.name=name;
    sec.innerHTML=`<div class="sample-cap">${name}</div><div class="slot"></div>`;
    col.appendChild(sec);renderSample(name);
    sec.addEventListener('click',e=>{
      const a=e.target.closest('[data-act]');
      if(a&&a.dataset.act==='link')e.preventDefault();
      if(a&&a.dataset.act==='toggle')cardState[name].open=!cardState[name].open;
      else if(a&&(a.dataset.act==='up'||a.dataset.act==='down'))cardState[name].vote=cardState[name].vote===a.dataset.act?null:a.dataset.act;
      renderSample(name);select(name);
    });
  });
})();

 ["Today",["Suggest top-performing keywords for product launches","Which leads have the highest conversion potential?","Recommend keywords with strong buyer intent"]],
 ["July 25, 2026",["Can you review my latest ad campaign results?","Analyze keyword trends over the past quarter"]],
 ["July 24, 2026",["Find keywords driving the most traffic this month","What keywords are competitors targeting now?","Identify seasonal keywords for upcoming promotions","Show me keywords with rising search volume","Suggest keywords for expanding into new markets","List keywords that improve ad click-through rates"]]
];
const AC_POOL=["How many accounts did I engage in the last 30 days","How many accounts did I engage through email campaigns","How many accounts did I engage through advertising campaigns","How many accounts did I engage for 6sense product","How many accounts should I have in a segment?","How are my keywords performing?","How are my new advertising campaigns doing?","What are high-intent keywords for my website?"];
const st={view:'orient',chat:[],title:null,sel:null,jtbd:null,expanded:{}};
let acIdx=-1;
const promptCard=q=>Card({title:esc(q),compact:true,onClickAttr:`data-q="${esc(q)}"`});

function answerData(q){
  const l=q.toLowerCase();
  const base={title:'Model',badge:'Score',updated:'Last updated on Oct 12, 2026',link:'Talk with RevvyAI'};
  if(l.includes('keyword'))return {...base,title:'Keyword performance',thesis:'Buyer-intent keywords are driving most of your qualified traffic this period.',factors:'Top drivers',intro:'These keywords contributed most to engaged-account growth.',
    items:[{driver:'Keyword: account based marketing',label:'High intent',desc:'+18% engaged accounts vs. the prior 30 days'},{driver:'Keyword: intent data platform',label:'Rising',desc:'Search volume up 24% quarter over quarter'},{driver:'Keyword: predictive lead scoring',label:'Stable',desc:'Consistent conversion across segments'}],cta:'Want me to build a segment from these keywords?'};
  if(l.includes('campaign')||l.includes('advertising'))return {...base,title:'Campaign performance',thesis:'Your newest campaigns are trending upward, led by account-based programs.',factors:'Top drivers',intro:'These campaigns lifted engagement the most.',
    items:[{driver:'Campaign: Q4 ABM Launch',label:'Top performer',desc:'412 accounts engaged, +12% vs. plan'},{driver:'Campaign: Product Webinar Series',label:'On track',desc:'Steady registrations across target tiers'},{driver:'Campaign: Retargeting Wave 2',label:'Needs review',desc:'Click-through is below the 30-day average'}],cta:'Want me to compare these against last quarter?'};
  if(l.includes('segment')||l.includes('accounts'))return {...base,title:'Segment guidance',thesis:'Smaller, well-defined segments tend to convert better and are easier to action.',factors:'Top factors',intro:'Use these factors when sizing a segment.',
    items:[{driver:'Fit: firmographic match',label:'Strong',desc:'Keep segments tied to a single ideal profile'},{driver:'Intent: recent engagement',label:'Rising',desc:'Aim for 200 to 500 accounts you can work this quarter'},{driver:'Coverage: contact data',label:'Review',desc:'Verify at least 3 buying-group contacts per account'}],cta:'Want me to size a segment for you?'};
  return {...base,title:'Summary',thesis:'Here is what I found based on your connected data.',factors:'Top factors',intro:'These factors had the biggest effect on the result.',
    items:[{driver:'Factor: engagement trend',label:'Up',desc:'Increasing over the last 30 days'},{driver:'Factor: account fit',label:'Strong',desc:'Most accounts match your ideal profile'},{driver:'Factor: data coverage',label:'Review',desc:'Some fields are missing for newer accounts'}],cta:'Want me to dig into any of these?'};
}

function setView(v){
  st.view=v;
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));
  $({orient:'#vOrient',chat:'#vChat',lib:'#vLib',hist:'#vHist'}[v]).classList.add('on');
  const titles={lib:'Prompt library',hist:'Chat history',chat:st.title};
  $('#subrow').hidden=!(v in titles);$('#subTitle').textContent=titles[v]||'';
  $('#bBack').style.display=(v==='lib'||v==='hist')?'':'none';
  $('#bLib').dataset.state=v==='lib'?'pressed':'';$('#bHist').dataset.state=v==='hist'?'pressed':'';
  $('#inputwrap').style.display=(v==='lib'||v==='hist')?'none':'';
  if(v==='chat'){const b=$('#body');b.scrollTop=b.scrollHeight}
  if(v==='lib')renderLib();if(v==='hist')renderHist();
}
function renderSmart(){
  $('#smart').innerHTML=SUGGESTIONS.map(promptCard).join('');
  $('#lastConv').innerHTML=Card({title:'6QA insights Apr-May 2025',subtitle:'Continue last conversation',compact:true,onClickAttr:'data-h="6QA insights Apr-May 2025"',headerAction:ic('chevronRight')});
  $('#chips').innerHTML=Object.keys(JTBD).map(k=>Chip(k,st.jtbd===k,`data-j="${k}"`)).join('');
  const jp=$('#jtbdPrompts');
  if(st.jtbd){jp.hidden=false;jp.innerHTML=`<p class="sec-title" style="margin:0">${st.jtbd}</p>`+JTBD[st.jtbd].map(promptCard).join('')}else jp.hidden=true;
}
function renderLib(){
  const q=$('#libSearch').value.trim().toLowerCase();
  const cats=[["Discovery","Discovery"],["Prioritize","Prioritization"],["Analysis","Analysis"],["Optimize","Optimization"],["Show value","Show value"],["Data management","Data management"]];
  let html='';
  cats.forEach(([label,key])=>{
    const all=JTBD[key].filter(p=>!q||p.toLowerCase().includes(q));if(!all.length)return;
    const open=st.expanded[key];const list=open||q?all:all.slice(0,3);
    html+=`<div class="group"><p class="sec-title" style="margin:0">${label}</p>${list.map(promptCard).join('')}${!q?`<span class="more">${Button({priority:'tertiary',size:'small',label:open?'View less':'View more',attrs:`data-more="${key}"`})}</span>`:''}</div>`;
  });
  $('#libList').innerHTML=html||'<div class="empty">No prompts match your search.</div>';
}
function renderHist(){
  const q=$('#histSearch').value.trim().toLowerCase();let html='';
  HISTORY.forEach(([d,items])=>{const f=items.filter(i=>!q||i.toLowerCase().includes(q));
    if(f.length)html+=`<div><h3>${d}</h3><ul class="MenuList_list" style="padding:0;max-block-size:none">${f.map(i=>`<li class="MenuList_item" role="button" tabindex="0"${st.sel===i?' data-selected':''} data-h="${esc(i)}"><span class="MenuList_text"><span class="MenuList_label">${esc(i)}</span></span></li>`).join('')}</ul></div>`});
  $('#histList').innerHTML=html||'<div class="empty">No conversations found.</div>';
}

/* chat: every AI message is a card rendered from Markdown */
function renderChat(){
  $('#vChat').innerHTML=`<div class="stamp">Today</div>`+st.chat.map((m,i)=>
    m.role==='user'?`<div class="user"><div class="bubble">${esc(m.text)}</div></div>`:
    m.loading?`<div class="thinking" role="status"><span class="Spinner_root" role="status" aria-label="Loading" data-size="small" data-tone="default"><span class="Spinner_ring" aria-hidden="true"></span></span>Thinking</div>`:
    `<div class="ai" data-m="${i}">${buildCard(m.md,CHAT_CFG,m,'chat'+i)}</div>`).join('');
  const b=$('#body');b.scrollTop=b.scrollHeight;
  const last=[...st.chat].reverse().find(m=>m.md);
  if(last&&!(selected&&last.fromCard===selected))setMd(last.md);
}
function clearSel(){selected=null;document.querySelectorAll('.sample').forEach(s=>s.classList.remove('sel'))}
function ask(q){
  q=q.trim();if(!q)return;
  if(!st.chat.length||st.view!=='chat')st.title=q.length>40?q.slice(0,40)+'…':q;
  clearSel();
  st.chat.push({role:'user',text:q});
  const m={role:'ai',loading:true};st.chat.push(m);
  setView('chat');renderChat();
  clearTimeout(ask.t);
  ask.t=setTimeout(()=>{m.loading=false;m.vote=null;m.md=toMd(answerData(q),CHAT_CFG);renderChat();setMd(m.md)},1200+Math.random()*500);
  $('#inp').value='';resize();hideAc();upd();
}
function feedRevvy(name,md){
  st.title=name;st.sel=null;
  st.chat=[{role:'user',text:`Show me the ${name} card`},{role:'ai',md,vote:null,fromCard:name}];
  setView('chat');renderChat();
}
function newChat(){st.chat=[];st.title=null;st.sel=null;st.jtbd=null;clearSel();setMd('');renderSmart();setView('orient')}
function openHistory(q){
  st.sel=q;st.title=q.length>40?q.slice(0,40)+'…':q;clearSel();
  const md=toMd(answerData(q),CHAT_CFG);st.chat=[{role:'user',text:q},{role:'ai',md,vote:null}];
  setView('chat');renderChat();setMd(md);
}

/* input + autosuggest (Search results listbox styles) */
const inp=$('#inp');
function resize(){inp.style.height='auto';inp.style.height=inp.scrollHeight+'px'}
function upd(){$('#bSend').setAttribute('aria-disabled',!inp.value.trim())}
function hideAc(){$('#ac').hidden=true;acIdx=-1}
function showAc(){
  const v=inp.value;if(v.trim().length<3){hideAc();return}
  const l=v.toLowerCase();const m=AC_POOL.filter(s=>s.toLowerCase().startsWith(l)&&s.length>v.length).slice(0,4);
  if(!m.length){hideAc();return}
  $('#ac').innerHTML=m.map((s,i)=>`<li class="Search_option" role="option" data-ac="${esc(s)}"${i===acIdx?' data-active':''}><span class="Search_optionText"><span class="Search_optionLabel">${esc(s.slice(0,v.length))}<b>${esc(s.slice(v.length))}</b></span></span></li>`).join('');
  $('#ac').hidden=false;
}
inp.addEventListener('input',()=>{resize();upd();acIdx=-1;showAc()});
inp.addEventListener('keydown',e=>{
  const items=[...document.querySelectorAll('#ac li')];
  if(!$('#ac').hidden&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();acIdx=(acIdx+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((b,i)=>b.toggleAttribute('data-active',i===acIdx));return}
  if(e.key==='Tab'&&!$('#ac').hidden){e.preventDefault();inp.value=items[Math.max(acIdx,0)].dataset.ac;hideAc();resize();upd();return}
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(acIdx>=0&&items[acIdx]){inp.value=items[acIdx].dataset.ac;hideAc();return}ask(inp.value)}
  if(e.key==='Escape')hideAc();
});
$('#ac').addEventListener('mousedown',e=>{const b=e.target.closest('[data-ac]');if(b){e.preventDefault();inp.value=b.dataset.ac;hideAc();resize();upd();inp.focus()}});
$('#bSend').onclick=()=>{if($('#bSend').getAttribute('aria-disabled')!=='true')ask(inp.value)};

/* header + events */
$('#bNew').onclick=newChat;
$('#bLib').onclick=()=>setView(st.view==='lib'?(st.chat.length?'chat':'orient'):'lib');
$('#bHist').onclick=()=>setView(st.view==='hist'?(st.chat.length?'chat':'orient'):'hist');
$('#bBack').onclick=()=>setView(st.chat.length?'chat':'orient');
$('#bMenu').onclick=e=>{e.stopPropagation();const m=$('#menu');m.hidden=!m.hidden;$('#bMenu').setAttribute('aria-expanded',!m.hidden)};
document.addEventListener('click',e=>{if(!e.target.closest('#menu')&&!e.target.closest('#bMenu')){$('#menu').hidden=true;$('#bMenu').setAttribute('aria-expanded','false')}});
$('#menu').addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;$('#menu').hidden=true;
  if(a.dataset.act==='clear')newChat();
  if(a.dataset.act==='copy'&&currentMd&&navigator.clipboard)navigator.clipboard.writeText(currentMd).catch(()=>{});});
$('#libSearch').oninput=renderLib;$('#histSearch').oninput=renderHist;
document.addEventListener('click',e=>{
  const q=e.target.closest('[data-q]');if(q){ask(q.dataset.q);return}
  const j=e.target.closest('[data-j]');if(j){st.jtbd=st.jtbd===j.dataset.j?null:j.dataset.j;renderSmart();return}
  const mo=e.target.closest('[data-more]');if(mo){const k=mo.dataset.more;st.expanded[k]=!st.expanded[k];renderLib();return}
  const h=e.target.closest('[data-h]');if(h){openHistory(h.dataset.h);return}
  const ai=e.target.closest('#vChat .ai');
  if(ai){
    const a=e.target.closest('[data-act]');if(!a)return;
    if(a.dataset.act==='link')e.preventDefault();
    if(a.dataset.act==='up'||a.dataset.act==='down'){
      const m=st.chat[+ai.dataset.m];m.vote=m.vote===a.dataset.act?null:a.dataset.act;
      ai.innerHTML=buildCard(m.md,CHAT_CFG,m,'chat'+ai.dataset.m);
    }
    if(a.dataset.act==='toggle'){/* chat cards are not collapsible */}
  }
});

/* init: cards, Markdown and companion in sync */
hydrate();renderModes();renderPanes();renderSmart();setView('orient');$('#bBack').style.display='none';
select('Card / Base',true);
</script>
</body>
