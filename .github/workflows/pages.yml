name: share-link

# Publishes:
# - Design system preview at /design-system-preview.html
# - Storybook at /storybook/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create build directories
        run: |
          mkdir -p _site
          mkdir -p src/preview

      - name: Build Storybook
        run: npm run build-storybook

      - name: Add Storybook to Pages
        run: |
          mkdir -p _site/storybook
          cp -r storybook-static/. _site/storybook/

      - name: Build design system preview
        run: ESBUILD_PATH=$(node -p "require.resolve('esbuild')") node scripts/build-preview.mjs --copy _site

      - name: Verify Storybook
        run: test -f _site/storybook/index.html

      - name: Verify design system preview
        run: test -f _site/design-system-preview.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
