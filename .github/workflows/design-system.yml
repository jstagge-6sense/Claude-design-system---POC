name: design-system

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build tokens
        run: node scripts/build-tokens.mjs .

      - name: Build modes
        run: node scripts/build-modes.mjs .

      - name: Check CSS variables are defined
        run: node scripts/check-css-vars.mjs .

      - name: Check component imports
        run: node scripts/check-components.mjs

      - name: Smoke test stories
        run: node scripts/smoke-test.mjs
