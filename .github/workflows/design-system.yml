name: design-system
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: node scripts/build-tokens.mjs .
      - run: node scripts/build-modes.mjs .        # dark theme + density, fails on WCAG AA contrast
      - run: node scripts/lean-tokens.mjs .        # lean set + lint of rewritten CSS
      - run: node scripts/lint-tokens.mjs .
      - run: node scripts/check-components.mjs
      - run: node scripts/smoke-test.mjs
      - run: ESBUILD_PATH=$(node -p "require.resolve('esbuild')") node scripts/build-preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: design-system-preview
          path: preview/design-system-preview.html
