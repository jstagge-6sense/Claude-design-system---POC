name: design-system

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build tokens
        run: node scripts/build-tokens.mjs .

      - name: Build modes
        run: node scripts/build-modes.mjs .

      - name: Lint tokens
        run: node scripts/lint-tokens.mjs .

      - name: Check components
        run: node scripts/check-components.mjs

      - name: Smoke test
        run: node scripts/smoke-test.mjs

      - name: SSR smoke test
        run: npm run smoke:ssr

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Test codemods
        run: npm run test:codemod

      - name: Build library
        run: npm run build

      - name: Verify library
        run: npm run verify

      - name: Check package
        run: npm run check:package
